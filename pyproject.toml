[project]
name = "delphi-modernizer-kit-tools"
version = "0.1.0"
description = "The kit's validator: spec, templates, agents, skills and links agree."
requires-python = ">=3.14"
license = "MIT"
# The validator needs nothing beyond the standard library.
dependencies = []

[dependency-groups]
tests = ["pytest>=9.2.0"]
lint = ["pyink>=24.10", "isort>=6.0", "pylint>=3.3"]
typecheck = ["mypy>=1.18", "pyright>=1.1.406"]


# https://google.github.io/styleguide/pyguide.html, as
# delphi-modernizer/.github standards/python/PYTHON-STYLE.md sets it.

[tool.pyink]
line-length = 80
target-version = ["py314"]
pyink-indentation = 4
# Splits long strings and hugs brackets, so that 80 columns stay readable.
unstable = true
include = '\.pyi?$'

[tool.isort]
profile = "google"
line_length = 80
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
src_paths = ["tools", "tests"]
known_first_party = ["validate"]
skip_gitignore = true


# Based on Google's pylintrc, with 4-space indentation.

[tool.pylint.main]
py-version = "3.14"
jobs = 0
source-roots = ["tools"]
load-plugins = ["pylint.extensions.docparams"]

[tool.pylint.format]
max-line-length = 80
indent-string = "    "
ignore-long-lines = '^\s*(# )?<?https?://\S+>?$|^\s*(from\s+\S+\s+)?import\s+.+$'

[tool.pylint.basic]
good-names = ["main", "_", "i", "j", "k", "fn"]
typevar-rgx = "^([A-Z]|T[A-Za-z]+)$"
no-docstring-rgx = "(__.*__|main|test.*|.*test|.*Test)$"
docstring-min-length = 12

[tool.pylint.parameter_documentation]
default-docstring-type = "google"
accept-no-param-doc = true
accept-no-raise-doc = true
accept-no-return-doc = true
accept-no-yields-doc = true

[tool.pylint.design]
max-args = 10
max-positional-arguments = 6
max-attributes = 20
max-locals = 20
max-returns = 10
max-branches = 12
max-statements = 50

[tool.pylint.similarities]
min-similarity-lines = 8
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    # mypy wants the `return None` of a function that may return something.
    "useless-return",
    "fixme",
    # Type checkers (mypy, pyright) own these.
    "import-error",
    "no-member",
    "no-name-in-module",
    # isort owns import order.
    "wrong-import-order",
    "ungrouped-imports",
]


[tool.mypy]
python_version = "3.14"
files = ["tools", "tests"]
mypy_path = "tools"
# `tests/` has no `__init__.py`; resolve its modules from the repo root.
explicit_package_bases = true
strict = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true

[tool.pyright]
include = ["tools", "tests"]
extraPaths = ["tools"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = "error"
strict = ["tools"]


[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]
