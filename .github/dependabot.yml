version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: nuget
    directory: /targets/dotnet/quality-baseline
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: maven
    directory: /targets/jvm/quality-baseline
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
