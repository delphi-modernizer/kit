name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
      - name: Check that spec, templates, agents, skills and links agree
        run: uv run --frozen python tools/validate.py
      - name: Lint the Markdown
        run: npx --yes markdownlint-cli2@0.24.0

  python:
    uses: delphi-modernizer/.github/.github/workflows/python-ci.yml@539243d668f72d31bbf8ee5c6ee732d0ed76bd95
    with:
      sources: tools
      tests: tests

  comments:
    uses: delphi-modernizer/.github/.github/workflows/comment-lint.yml@539243d668f72d31bbf8ee5c6ee732d0ed76bd95
    with:
      standards-ref: 539243d668f72d31bbf8ee5c6ee732d0ed76bd95

  drift:
    uses: delphi-modernizer/.github/.github/workflows/standards-drift.yml@539243d668f72d31bbf8ee5c6ee732d0ed76bd95
    with:
      standards-ref: 539243d668f72d31bbf8ee5c6ee732d0ed76bd95
      files: |
        docs/COMMENTS.md=COMMENTS.md
        targets/dotnet/quality-baseline/.editorconfig=standards/csharp/.editorconfig
        targets/dotnet/quality-baseline/tests/.editorconfig=standards/csharp/tests.editorconfig
        targets/dotnet/quality-baseline/docs/COMMENTS.md=COMMENTS.md
        targets/dotnet/quality-baseline/docs/csharp-style.md=standards/csharp/csharp-style.md
        targets/jvm/quality-baseline/.editorconfig=standards/java/.editorconfig
        targets/jvm/quality-baseline/docs/COMMENTS.md=COMMENTS.md

  dependencies:
    uses: delphi-modernizer/.github/.github/workflows/dependency-review.yml@539243d668f72d31bbf8ee5c6ee732d0ed76bd95

  dotnet-baseline:
    uses: delphi-modernizer/.github/.github/workflows/dotnet-ci.yml@539243d668f72d31bbf8ee5c6ee732d0ed76bd95
    with:
      working-directory: targets/dotnet/quality-baseline
      solution: Modernized.slnx
      os: '["ubuntu-latest", "windows-latest"]'

  jvm-baseline:
    uses: delphi-modernizer/.github/.github/workflows/java-ci.yml@539243d668f72d31bbf8ee5c6ee732d0ed76bd95
    with:
      working-directory: targets/jvm/quality-baseline
